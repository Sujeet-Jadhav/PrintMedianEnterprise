# Database Configuration
spring.application.name=printmedianenterprise
spring.datasource.url=jdbc:mysql://localhost:3306/print_median_enterprise
spring.datasource.username=root
spring.datasource.password=root

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Changed to 'update' to allow Hibernate to create/update tables
# Use 'validate' in production after initial setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.user.url=http://localhost:4200/login

# Server IP Address - bind to all interfaces
#server.address=192.168.29.85
server.address=0.0.0.0
server.port=8080

# Flyway Configuration for Database Migrations
# Temporarily disabled to let Hibernate create initial schema
spring.flyway.enabled=false
# Allow clean in dev
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
