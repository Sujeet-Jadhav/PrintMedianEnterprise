version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: print-median-mysql
    restart: always
    environment:
      MYSQL_DATABASE: print_median_enterprise
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - print-median-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: print-median-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - print-median-network

volumes:
  mysql-data:

networks:
  print-median-network:
    driver: bridge
